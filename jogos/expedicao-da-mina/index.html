<title>Expedição da Mina do R Brando</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Press+Start+2P&display=swap">
<style>
/* Layout: uma trilha vertical de seis mundos; dentro de cada mundo, um cartão grande por vez com botões da terapeuta embaixo. */
:root{
  --bg:#1c1814; --panel:#2b241e; --panel2:#362d25; --line:#4d4135;
  --text:#f4ecdb; --muted:#bfb29b;
  --grass:#6fb544; --grass-d:#3f7a27; --red:#d8412f; --red-t:#ff7a65;
  --gold:#f0bf2e; --dia:#4fe0d0; --stone:#7b756d; --stone-d:#57514a;
  --font-d:'Press Start 2P',ui-monospace,Menlo,monospace;
  --font-b:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--text); font-family:var(--font-b); font-size:17px; line-height:1.45; font-weight:600;
  padding-block:16px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:linear-gradient(var(--bg),var(--bg));
}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px;min-width:0}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--dia);outline-offset:2px}

.panel{background:var(--panel);box-shadow:0 0 0 3px var(--line),0 6px 0 3px #110e0b;padding:16px}
.kicker{font-family:var(--font-d);font-size:10px;letter-spacing:.08em;color:var(--grass);text-transform:uppercase}
h1{font-family:var(--font-d);font-size:clamp(15px,4.4vw,24px);line-height:1.5;margin-top:8px;text-wrap:balance}

.btn{
  border:3px solid #120f0c;background:var(--stone);color:#fff;min-height:56px;padding:10px 18px;font-weight:900;font-size:18px;
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.3),inset 4px 4px 0 rgba(255,255,255,.2);
  display:inline-flex;align-items:center;justify-content:center;gap:10px;text-align:center;min-width:0;
}
.btn:active{transform:translateY(2px)}
.btn.go{background:var(--grass-d)} .btn.mid{background:#a77d12} .btn.soft{background:#4b453f}
.btn.sm{min-height:44px;padding:6px 14px;font-size:15px}

/* status */
.status{display:grid;gap:12px}
.lv{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.lv b{font-family:var(--font-d);font-size:13px;color:var(--gold);line-height:1.5}
.lv span{color:var(--muted);font-size:15px}
.bar{height:18px;background:#15110e;box-shadow:0 0 0 3px var(--line);position:relative;overflow:hidden}
.bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--grass) 0 12px,#5ba337 12px 14px);transition:width .5s}
.ores{display:flex;flex-wrap:wrap;gap:8px 14px}
.oc{display:flex;align-items:center;gap:6px;font-weight:900;font-size:16px;font-variant-numeric:tabular-nums}
.ore{image-rendering:pixelated;display:block}

.edge{display:flex;align-items:center;gap:12px;font-family:var(--font-d);font-size:11px;color:var(--muted)}
.worlds{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:16px}
.wcard{
  width:100%;height:100%;text-align:left;background:var(--panel);border:0;padding:14px;display:grid;gap:10px;align-content:start;
  box-shadow:0 0 0 3px var(--line),0 6px 0 3px #110e0b;
}
.wcard:hover{background:var(--panel2)}
.wcard.next{box-shadow:0 0 0 3px var(--gold),0 6px 0 3px #110e0b}
.wcard.full{box-shadow:0 0 0 3px var(--grass-d),0 6px 0 3px #110e0b}
.wtop{display:flex;align-items:center;gap:12px}
.wnum{font-family:var(--font-d);font-size:10px;color:var(--muted);line-height:1.6}
.wcard h2{font-size:19px;font-weight:900;line-height:1.2}
.wsub{color:var(--muted);font-size:15px}
.dots{display:flex;flex-wrap:wrap;gap:4px}
.dots i{width:12px;height:12px;background:#15110e;box-shadow:0 0 0 2px var(--line)}
.dots i.a{background:var(--grass);box-shadow:0 0 0 2px var(--grass-d)}
.dots i.q{background:var(--gold);box-shadow:0 0 0 2px #8a6a10}
.dots i.t{background:var(--stone);box-shadow:0 0 0 2px var(--stone-d)}
.tag{display:inline-block;font-family:var(--font-d);font-size:9px;line-height:1.6;padding:4px 8px;background:#15110e;color:var(--gold);justify-self:start}
.tag.g{color:var(--grass)} .tag.n{color:var(--dia)}

/* therapist panel */
.tp h3{font-family:var(--font-d);font-size:11px;line-height:1.6;color:var(--gold)}
.tp p{color:var(--muted);font-size:15px}
.tp table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.tp th,.tp td{padding:6px 8px;text-align:left;border-bottom:2px solid var(--line)}
.tp th{color:var(--muted);font-weight:800}
.tpw{overflow-x:auto}
.row{display:flex;gap:10px;flex-wrap:wrap}

/* world */
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar .ttl{flex:1;min-width:160px}
.ttl .wnum{display:block}
.ttl b{font-weight:900;font-size:19px}
.pc{display:flex;align-items:center;gap:6px;font-weight:900;font-variant-numeric:tabular-nums}
.stage{
  background:var(--panel);box-shadow:0 0 0 3px var(--line),0 6px 0 3px #110e0b;padding:22px 16px 26px;
  display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;min-height:330px;justify-content:center;position:relative;overflow:hidden;
}
.stage.hit{animation:pop .5s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.03);box-shadow:0 0 0 3px var(--grass),0 0 0 12px rgba(111,181,68,.25)}100%{transform:scale(1)}}
.tile{
  font-size:84px;line-height:1;padding:14px 20px;background:
  linear-gradient(45deg,rgba(255,255,255,.04) 25%,transparent 25% 75%,rgba(255,255,255,.04) 75%) 0 0/16px 16px,#3b342d;
  box-shadow:0 0 0 3px #120f0c,inset -6px -6px 0 rgba(0,0,0,.25),inset 6px 6px 0 rgba(255,255,255,.1);
}
.tile.two{font-size:60px;letter-spacing:.1em}
.big{font-size:clamp(44px,13vw,84px);font-weight:900;line-height:1.05;letter-spacing:.01em;overflow-wrap:anywhere}
.big.phrase{font-size:clamp(28px,7vw,44px);line-height:1.2;text-wrap:balance}
.big.ask{font-size:clamp(26px,6.5vw,40px);line-height:1.2;text-wrap:balance}
.big .r,.blk .r{color:var(--red-t)}
.sil{color:var(--muted);font-size:20px;letter-spacing:.08em;font-weight:800}
.inst{color:var(--muted);font-size:18px;max-width:34ch;text-wrap:pretty}
.blocks{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.blk{
  font-family:var(--font-d);font-size:clamp(20px,5.5vw,32px);padding:18px 14px;min-width:78px;background:var(--stone);color:#fff;text-align:center;
  box-shadow:0 0 0 3px #120f0c,inset -5px -5px 0 rgba(0,0,0,.28),inset 5px 5px 0 rgba(255,255,255,.2);
}
.steps{display:flex;flex-direction:column;gap:8px;align-items:flex-start;width:100%;max-width:420px}
.step{display:flex;align-items:center;gap:10px;min-width:0;max-width:100%}
.step.s1{margin-left:clamp(12px,6vw,40px)} .step.s2{margin-left:clamp(24px,12vw,80px)}
.step .blk{font-size:clamp(15px,4.4vw,24px);padding:12px 14px;min-width:0;overflow-wrap:anywhere}
.step.s2 .blk{background:var(--grass-d)}
.sn{font-family:var(--font-d);font-size:12px;color:var(--gold);width:16px;flex:none}
.arrow{font-family:var(--font-d);font-size:28px;color:var(--gold)}
.pips{display:flex;gap:10px}
.pips i{width:30px;height:30px;background:#15110e;box-shadow:0 0 0 3px var(--line)}
.pips i.on{background:var(--grass);box-shadow:0 0 0 3px var(--grass-d)}
.gain{position:absolute;right:16px;top:12px;display:flex;align-items:center;gap:6px;font-family:var(--font-d);font-size:12px;color:var(--grass);animation:up 1s forwards}
@keyframes up{from{transform:translateY(10px);opacity:0}30%{opacity:1}to{transform:translateY(-14px);opacity:0}}
.msg{min-height:30px;text-align:center;font-weight:900;font-size:20px;color:var(--gold)}
.ctrl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ctrl.one{grid-template-columns:1fr}
.ctrl .btn{min-height:72px;font-size:19px;flex-direction:column;gap:2px;padding:8px}
.ctrl .btn small{font-size:13px;font-weight:700;opacity:.9}
.hint{color:var(--muted);font-size:15px;text-align:center;text-wrap:balance}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nav span{color:var(--muted);font-weight:800;font-variant-numeric:tabular-nums}
.jump{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.jump button{width:26px;height:26px;border:0;padding:0;background:#15110e;box-shadow:0 0 0 2px var(--line)}
.jump button.a{background:var(--grass)} .jump button.q{background:var(--gold)} .jump button.t{background:var(--stone)}
.jump button.cur{box-shadow:0 0 0 3px var(--text)}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:20;
  background:var(--gold);color:#201807;font-family:var(--font-d);font-size:12px;line-height:1.6;padding:12px 16px;box-shadow:0 0 0 3px #120f0c;max-width:calc(100% - 32px);text-align:center;
}

/* chest */
.chestv{align-items:center;text-align:center;gap:16px;padding:28px 16px}
.chestv h2{font-family:var(--font-d);font-size:clamp(14px,4vw,20px);line-height:1.6;text-wrap:balance}
.loot{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:900}
.chestv .glow{animation:glow 1.6s infinite alternate}
@keyframes glow{from{filter:drop-shadow(0 0 4px rgba(79,224,208,.2))}to{filter:drop-shadow(0 0 16px rgba(79,224,208,.75))}}
.sum{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;color:var(--muted);font-size:16px}
.sum b{color:var(--text)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.ctrl .btn{font-size:16px}.tile{font-size:68px}}
</style>

 {n:'Caverna das Palavras',s:'R entre vogais',tip:'R entre vogais. A silabação aparece embaixo da palavra e pode ser usada como modelo.',items:K('word',[

  {w:'barata',e:'🪳',sl:'ba·ra·ta'},{w:'aranha',e:'🕷️',sl:'a·ra·nha'},{w:'coruja',e:'🦉',sl:'co·ru·ja'},

 {n:'Vila dos Encontros',s:'BRA PRA TRA e outros',tip:'Encontros com R. Silabe devagar (pa·ra·to) e acelere até a palavra (pra·to).',items:K('word',[
  {w:'braço',e:'💪',sl:'bra·ço',g:'BRA'},{w:'bravo',e:'😠',sl:'bra·vo',g:'BRA'},
  {w:'prato',e:'🍽️',sl:'pra·to',g:'PRA'},{w:'praia',e:'🏖️',sl:'prai·a',g:'PRA'},
  {w:'trem',e:'🚂',sl:'trem',g:'TRE'},{w:'trilho',e:'🛤️',sl:'tri·lho',g:'TRI'},

 {n:'Base Secreta',s:'Frases e conversa',tip:'Frases e conversa. Ajuste a exigência ao que a criança sustenta. As perguntas não pedem R perfeito.',items:[

  {k:'phrase',w:'A aranha subiu na parede.',e:'🕷️🧱'},{k:'phrase',w:'A cobra viu a barata.',e:'🐍🪳'},
  {k:'phrase',w:'O trem trouxe a cenoura.',e:'🚂🥕'},{k:'phrase',w:'A coruja entrou no buraco.',e:'🦉🕳️'},

  {k:'talk',w:'Missão final: conte uma partida em 3 frases!',e:'🏆'}]},
 {n:'Forja dos Encontros',s:'Língua mole, R suave no encontro',tip:'Se o queixo subir, o pescoço travar ou a voz apertar, volte um degrau e recomece pelo relaxamento. Poucas repetições, com pausa.',items:[].concat(

  {t:['DA·RA·GÃO','D(a)RA·GÃO','DRAGÃO'],e:'🐉'},
  {t:['BA·RA·ÇO','B(a)RA·ÇO','BRAÇO'],e:'💪'},
  {t:['PA·RA·TO','P(a)RA·TO','PRATO'],e:'🍽️'},

];
var RANK={acertou:3,quase:2,tentou:1}, XPF={acertou:2,quase:1,tentou:1};
var MSG={acertou:['Isso! Minério na mochila!','Mandou bem!','Picareta certeira!','Muito bem!'],
         quase:['Quase! Boa tentativa.','Chegando lá!'],tentou:['Boa tentativa! Vamos para a próxima.']};

/* ---------- estado ---------- */
var KEY='r-brando-v1', S={done:{},sound:true};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.done){S.done=p.done;if(typeof p.sound==='boolean')S.sound=p.sound}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var V={name:'map',wi:0,ii:0,tries:0,pips:0,msg:'',lock:false,replay:false,tp:false,conf:false,up:null};

function res(wi,ii){var d=S.done[wi];return d?d[ii]:undefined}
function counts(wi){var n=W[wi].items.length,c={a:0,q:0,t:0,total:n,done:0};
  for(var i=0;i<n;i++){var r=res(wi,i);if(r==='acertou')c.a++;else if(r==='quase')c.q++;else if(r==='tentou')c.t++}
  c.done=c.a+c.q+c.t;return c}
function xpTotal(){var x=0;for(var w=0;w<W.length;w++){var c=counts(w);x+=c.a*2+c.q+c.t}return x}

  return {L:L,cur:LV[L],nx:nx,pct:nx?Math.round((xp-LV[L].at)/(nx.at-LV[L].at)*100):100}}

function firstOpen(wi){for(var i=0;i<W[wi].items.length;i++)if(!res(wi,i))return i;return 0}

/* ---------- ícones em pixel ---------- */
function ore(c,size){
  var dots=[[2,2],[4,2],[2,4],[9,3],[11,3],[11,5],[4,9],[6,9],[4,11],[10,10],[12,10],[10,12]];
  var sp=[[0,6],[7,0],[13,7],[8,14],[1,13],[14,1],[7,7]];
  var s='<svg class="ore" width="'+size+'" height="'+size+'" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><rect width="16" height="16" fill="#7b756d"/>';
  sp.forEach(function(p){s+='<rect x="'+p[0]+'" y="'+p[1]+'" width="2" height="2" fill="#5f5a53"/>'});
  dots.forEach(function(p){s+='<rect x="'+p[0]+'" y="'+p[1]+'" width="2" height="2" fill="'+c+'"/>'});
  return s+'<rect width="16" height="1" fill="#9a948b"/><rect y="15" width="16" height="1" fill="#55504a"/></svg>'}
function grass(size){
  return '<svg class="ore" width="'+size+'" height="'+size+'" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><rect width="16" height="16" fill="#8a5a2b"/><rect width="16" height="5" fill="#6fb544"/><rect y="5" width="2" height="2" fill="#6fb544"/><rect x="6" y="5" width="3" height="1" fill="#6fb544"/><rect x="12" y="5" width="2" height="2" fill="#6fb544"/><rect x="3" y="9" width="2" height="2" fill="#6e4521"/><rect x="10" y="11" width="2" height="2" fill="#6e4521"/><rect x="7" y="13" width="2" height="2" fill="#a06d38"/></svg>'}
function chest(open,size){
  var b='<rect x="1" y="6" width="14" height="7" fill="#8a5a2b"/><rect x="1" y="9" width="14" height="1" fill="#5b3a1a"/><rect x="1" y="12" width="14" height="1" fill="#5b3a1a"/><rect x="0" y="6" width="1" height="7" fill="#3b2410"/><rect x="15" y="6" width="1" height="7" fill="#3b2410"/>';
  var s='<svg class="ore'+(open?' glow':'')+'" width="'+size+'" height="'+Math.round(size*14/16)+'" viewBox="0 0 16 14" shape-rendering="crispEdges" aria-hidden="true">';
  if(open){s+='<rect x="2" y="0" width="12" height="3" fill="#a56d33"/><rect x="2" y="0" width="12" height="1" fill="#c48a4a"/>'+b+'<rect x="2" y="4" width="12" height="2" fill="#4fe0d0"/><rect x="4" y="3" width="2" height="2" fill="#bff7f1"/><rect x="9" y="3" width="2" height="2" fill="#f2c230"/><rect x="7" y="7" width="2" height="3" fill="#f0bf2e"/>'}
  else{s+=b+'<rect x="1" y="3" width="14" height="4" fill="#a56d33"/><rect x="1" y="3" width="14" height="1" fill="#c48a4a"/><rect x="7" y="6" width="2" height="3" fill="#f0bf2e"/>'}
  return s+'</svg>'}
function oi(i,size){return ore(ORES[i].c,size||20)}

/* ---------- som ---------- */
var ac;
function beep(seq){if(!S.sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  seq.forEach(function(n){var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+n[1];o.type='square';o.frequency.value=n[0];
  o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.04,t);g.gain.exponentialRampToValueAtTime(.0001,t+n[2]);o.start(t);o.stop(t+n[2]+.02)})}catch(e){}}
var SND={a:[[660,0,.1],[880,.1,.16]],q:[[520,0,.14]],p:[[440,0,.07]],c:[[523,0,.12],[659,.12,.12],[784,.24,.12],[1047,.36,.3]]};

/* ---------- telas ---------- */
function mapHTML(){
  var xp=xpTotal(),li=level(xp),nx=nextWorld(),h='';
  h+='<header><div class="kicker">Terapia do R brando</div><h1>Expedição da Mina do R Brando</h1></header>';
  h+='<section class="panel status"><div class="lv"><b>'+esc(li.cur.n)+'</b><span>'+(li.nx?xp+' de '+li.nx.at+' pontos para '+esc(li.nx.n):xp+' pontos. Nível máximo!')+'</span></div>';
  h+='<div class="bar" role="progressbar" aria-label="Pontos até o próximo nível" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+li.pct+'"><i style="width:'+li.pct+'%"></i></div><div class="ores">';
  for(var i=0;i<W.length;i++)h+='<span class="oc" title="'+ORES[i].n+'">'+oi(i,22)+counts(i).a+'</span>';
  h+='</div></section>';
  h+='<div class="edge">'+grass(36)+'<span>LARGADA</span></div><ol class="worlds">';
  for(var w=0;w<W.length;w++){var c=counts(w),cls=c.done>=c.total?'full':(nx===w?'next':'');
    var st=c.done>=c.total?'<span class="tag g">CONCLUÍDO</span>':(nx===w?'<span class="tag">PRÓXIMO</span>':'<span class="tag n">'+c.done+' DE '+c.total+'</span>');
    h+='<li><button class="wcard '+cls+'" data-act="open" data-w="'+w+'"><div class="wtop">'+oi(w,44)+'<div><span class="wnum">MUNDO '+(w+1)+'</span><h2>'+esc(W[w].n)+'</h2></div></div><p class="wsub">'+esc(W[w].s)+'</p><div class="dots" aria-hidden="true">';
    for(var i=0;i<c.total;i++){var r=res(w,i);h+='<i class="'+(r==='acertou'?'a':r==='quase'?'q':r==='tentou'?'t':'')+'"></i>'}
    h+='</div>'+st+'</button></li>'}
  h+='</ol><div class="edge">'+chest(false,40)+'<span>CHEGADA</span></div>';
  h+='<section class="panel tp" style="display:grid;gap:12px"><div class="row" style="justify-content:space-between;align-items:center"><h3>Painel da terapeuta</h3><button class="btn sm soft" data-act="tp">'+(V.tp?'Fechar':'Abrir')+'</button></div>';
  if(V.tp){
    h+='<p>O jogo não escuta a criança. Quem marca Acertou, Quase ou Tentar de novo é você, e o progresso fica salvo neste navegador.</p><div class="tpw"><table><thead><tr><th>Mundo</th><th>Acertou</th><th>Quase</th><th>Tentou</th></tr></thead><tbody>';
    for(var k=0;k<W.length;k++){var d=counts(k);h+='<tr><td>'+(k+1)+'. '+esc(W[k].n)+'</td><td>'+d.a+' de '+d.total+'</td><td>'+d.q+'</td><td>'+d.t+'</td></tr>'}
    h+='</tbody></table></div><div class="row"><button class="btn sm soft" data-act="snd">Som: '+(S.sound?'ligado':'desligado')+'</button>';
    h+=V.conf?'<button class="btn sm mid" data-act="reset2">Confirmar: zerar tudo</button><button class="btn sm soft" data-act="reset0">Cancelar</button>':'<button class="btn sm soft" data-act="reset1">Zerar progresso</button>';
    h+='</div>'}
  return h+'</section>'}

function stageHTML(it){
  var h='';
  if(it.k==='drill'){
    h+='<div class="tile">'+it.e+'</div><h2 class="big" style="font-size:clamp(30px,8vw,48px)">'+esc(it.t)+'</h2><p class="inst">'+esc(it.d)+'</p><div class="pips" aria-label="'+V.pips+' de 5 repetições">';
    for(var i=0;i<5;i++)h+='<i class="'+(i<V.pips?'on':'')+'"></i>';h+='</div>'}
  else if(it.k==='syll'){
    h+='<span class="tag">'+esc(it.g).toUpperCase()+'</span><div class="blocks">'+it.t.map(function(t){return '<div class="blk">'+hl(t)+'</div>'}).join('')+'</div><p class="inst">Fale cada bloco, um de cada vez.</p>'}
  else if(it.k==='trans'){
    h+='<span class="tag">DO DA PARA O RA</span><div class="blocks"><div class="blk">'+hl(it.a)+'</div><span class="arrow">&rarr;</span><div class="blk">'+hl(it.b)+'</div></div><p class="inst">Fale '+esc(it.a)+' rápido, rápido, rápido, até virar '+esc(it.b)+'.</p>'}
  else if(it.k==='ladder'){
    h+='<span class="tag">ESCADA DA VOGAL FANTASMA</span><div class="tile two">'+it.e+'</div><div class="steps">';
    it.t.forEach(function(s,i){h+='<div class="step s'+i+'"><span class="sn">'+(i+1)+'</span><span class="blk">'+hl(s)+'</span></div>'});
    h+='</div><p class="inst">Fale de cima para baixo, juntando mais a cada degrau. A vogal do meio fica bem pequena.</p>'}
  else if(it.k==='word'){
    if(it.g)h+='<span class="tag">'+esc(it.g)+'</span>';
    h+='<div class="tile">'+it.e+'</div><div class="big">'+hl(it.w)+'</div><div class="sil">'+esc(it.sl)+'</div>'}
  else if(it.k==='phrase'){
    h+='<div class="tile two">'+it.e+'</div><div class="big phrase">'+hl(it.w)+'</div>'}
  else{h+='<div class="tile">'+it.e+'</div><div class="big ask">'+esc(it.w)+'</div>'}
  return h}

function worldHTML(){
  var w=W[V.wi],it=w.items[V.ii],c=counts(V.wi),h='',i;
  if(V.up)h+='<div class="toast" role="status">NOVO NÍVEL: '+esc(V.up).toUpperCase()+'</div>';
  h+='<div class="topbar"><button class="btn sm soft" data-act="back">&larr; Mapa</button><div class="ttl"><span class="wnum">MUNDO '+(V.wi+1)+'</span><b>'+esc(w.n)+'</b></div><div class="pc">'+oi(V.wi,24)+c.a+'</div></div>';
  h+='<div class="jump" role="group" aria-label="Itens do mundo">';
  for(i=0;i<w.items.length;i++){var r=res(V.wi,i);h+='<button data-act="jump" data-i="'+i+'" aria-label="Item '+(i+1)+(r?', '+r:'')+'" class="'+(r==='acertou'?'a':r==='quase'?'q':r==='tentou'?'t':'')+(i===V.ii?' cur':'')+'"></button>'}
  h+='</div><div class="stage" id="stage">'+stageHTML(it)+'</div><div class="msg" aria-live="polite" id="msg">'+esc(V.msg)+'</div>';
  if(it.k==='drill'){
    h+='<div class="ctrl one"><button class="btn go" data-act="pip">Fez mais uma vez <small>'+V.pips+' de 5</small></button></div>'}
  else{
    h+='<div class="ctrl"><button class="btn go" data-act="hit">'+(it.k==='talk'?'Contou!':'Acertou')+'<small>+2 pontos</small></button><button class="btn mid" data-act="near">Quase<small>+1 ponto</small></button><button class="btn soft" data-act="again">Tentar de novo<small>'+(3-V.tries)+' chances</small></button></div>'}
  h+='<p class="hint">'+esc(w.tip)+'</p><div class="nav"><button class="btn sm soft" data-act="prev">&lsaquo; Anterior</button><span>'+(V.ii+1)+' de '+w.items.length+'</span><button class="btn sm soft" data-act="skip">Pular &rsaquo;</button></div>';
  return h}

function chestHTML(){
  var w=W[V.wi],c=counts(V.wi),all=nextWorld()===-1,h='<section class="panel chestv" style="display:flex;flex-direction:column">';
  h+=chest(true,160)+'<h2>'+(all?'Você é Mestre da Mina!':'Baú aberto! Mundo '+(V.wi+1)+' concluído')+'</h2>';
  h+='<div class="loot">'+oi(V.wi,40)+'<span>'+c.a+' '+ORES[V.wi].n.toLowerCase()+'</span></div>';
  h+='<div class="sum"><span><b>'+c.a+'</b> acertos</span><span><b>'+c.q+'</b> quase</span><span><b>'+c.t+'</b> tentativas</span></div>';
  h+='<p class="inst">'+(all?'Todos os mundos foram explorados. Que expedição!':'Muito bem! '+esc(w.n)+' ficou para trás.')+'</p><div class="row" style="justify-content:center"><button class="btn go" data-act="back">Voltar ao mapa</button>';
  if(!all&&V.wi<W.length-1)h+='<button class="btn mid" data-act="nextw">Próximo mundo</button>';
  return h+'</div></section>'}

function render(){var a=$('#app');a.innerHTML=V.name==='map'?mapHTML():V.name==='world'?worldHTML():chestHTML();
  if(V.up){setTimeout(function(){V.up=null;var t=$('.toast');if(t)t.remove()},2800)}}
function go(){render();window.scrollTo(0,0)}

/* ---------- ações ---------- */
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function openWorld(wi){var done=counts(wi).done>=counts(wi).total;V={name:'world',wi:wi,ii:done?0:firstOpen(wi),tries:0,pips:0,msg:'',lock:false,replay:done,tp:V.tp,conf:false,up:null};go()}
function advance(){
  var w=W[V.wi],n=w.items.length,c=counts(V.wi);
  V.lock=false;V.tries=0;V.pips=0;V.msg='';
  if(V.replay){if(V.ii+1<n){V.ii++;render()}else{V.name='chest';beep(SND.c);go()}return}
  if(c.done>=c.total){V.name='chest';beep(SND.c);go();return}
  var nx=-1;for(var k=1;k<=n;k++){var j=(V.ii+k)%n;if(!res(V.wi,j)){nx=j;break}}
  V.ii=nx<0?V.ii:nx;render()}
function record(r){
  if(V.lock)return;V.lock=true;
  var key=V.wi,before=level(xpTotal()).L,d=S.done[key]||(S.done[key]={}),old=d[V.ii];
  if(!old||RANK[r]>RANK[old])d[V.ii]=r;
  save();
  var after=level(xpTotal()).L;if(after>before)V.up=LV[after].n;
  V.msg=pick(MSG[r]);
  var m=$('#msg');if(m)m.textContent=V.msg;
  var st=$('#stage');
  if(st&&r==='acertou'){st.classList.add('hit');var g=document.createElement('div');g.className='gain';g.innerHTML='+1 '+oi(V.wi,22);st.appendChild(g)}
  beep(r==='acertou'?SND.a:SND.q);
  setTimeout(advance,r==='acertou'?900:700)}
function act(a,d){
  if(a==='open')openWorld(+d.w);
  else if(a==='back'){V.name='map';V.conf=false;go()}
  else if(a==='nextw'){openWorld(V.wi+1)}
  else if(a==='hit')record('acertou');
  else if(a==='near')record('quase');
  else if(a==='again'){if(V.lock)return;V.tries++;if(V.tries>=3){record('tentou')}else{V.msg='Boa tentativa! Vamos de novo.';render()}}
  else if(a==='pip'){if(V.lock)return;V.pips++;if(V.pips>=5){V.pips=5;record('acertou');var p=$('.pips');if(p)p.innerHTML=new Array(6).join('<i class="on"></i>')}else{beep(SND.p);render()}}
  else if(a==='skip'){if(V.lock)return;var n=W[V.wi].items.length;V.ii=(V.ii+1)%n;V.tries=0;V.pips=0;V.msg='';render()}
  else if(a==='prev'){if(V.lock)return;var n2=W[V.wi].items.length;V.ii=(V.ii-1+n2)%n2;V.tries=0;V.pips=0;V.msg='';render()}
  else if(a==='jump'){if(V.lock)return;V.ii=+d.i;V.tries=0;V.pips=0;V.msg='';render()}
  else if(a==='tp'){V.tp=!V.tp;V.conf=false;render()}
  else if(a==='snd'){S.sound=!S.sound;save();render()}
  else if(a==='reset1'){V.conf=true;render()}
  else if(a==='reset0'){V.conf=false;render()}
  else if(a==='reset2'){S.done={};save();V.conf=false;render()}}
document.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(b)act(b.getAttribute('data-act'),b.dataset)});
render();
})();
</script>

</body></html>
