<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Forja do Elástico</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Press+Start+2P&display=swap">
<style>
/* Visual único e escuro de propósito (forja de mina). Alvos grandes para toque no iPad. */
:root{
  --bg:#1c1814; --panel:#2b241e; --panel2:#362d25; --line:#4d4135;
  --text:#f4ecdb; --muted:#bfb29b;
  --grass:#6fb544; --grass-d:#3f7a27; --red-t:#ff7a65; --gold:#f0bf2e; --dia:#4fe0d0; --stone:#7b756d;
  --font-d:'Press Start 2P',ui-monospace,Menlo,monospace;
  --font-b:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--bg);color:var(--text);font-family:var(--font-b);font-size:18px;line-height:1.45;font-weight:600;
  padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:18px;min-width:0}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--dia);outline-offset:2px}
.panel{background:var(--panel);box-shadow:0 0 0 3px var(--line),0 6px 0 3px #110e0b;padding:18px}
.kicker{font-family:var(--font-d);font-size:10px;letter-spacing:.08em;color:var(--grass);text-transform:uppercase}
h1{font-family:var(--font-d);font-size:clamp(16px,4.6vw,26px);line-height:1.5;margin-top:8px;text-wrap:balance}
h2{font-family:var(--font-d);font-size:12px;line-height:1.6;color:var(--gold);font-weight:400}
.lead{color:var(--muted);margin-top:8px;max-width:58ch;text-wrap:pretty}
.hint{color:var(--muted);font-size:15px;text-wrap:pretty}
.btn{
  border:3px solid #120f0c;background:var(--stone);color:#fff;min-height:60px;padding:10px 18px;font-weight:900;font-size:19px;
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.3),inset 4px 4px 0 rgba(255,255,255,.2);
  display:inline-flex;align-items:center;justify-content:center;gap:10px;text-align:center;min-width:0;
}
.btn:active{transform:translateY(2px)}
.btn.go{background:var(--grass-d)} .btn.mid{background:#a77d12} .btn.soft{background:#4b453f}
.btn.big{min-height:76px;font-size:22px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.dia{display:inline-flex;align-items:center;gap:8px;font-weight:900;font-size:22px;font-variant-numeric:tabular-nums}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tab{
  border:3px solid #120f0c;background:#3a332c;min-height:64px;padding:8px 12px;font-weight:900;font-size:18px;color:var(--text);
  box-shadow:inset -3px -3px 0 rgba(0,0,0,.3),inset 3px 3px 0 rgba(255,255,255,.12)
}
.tab[aria-selected="true"]{background:var(--grass-d);box-shadow:0 0 0 3px var(--gold),inset -3px -3px 0 rgba(0,0,0,.3),inset 3px 3px 0 rgba(255,255,255,.2)}

.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.pk{
  border:3px solid #120f0c;background:#3a332c;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:84px;position:relative;
  box-shadow:inset -3px -3px 0 rgba(0,0,0,.3),inset 3px 3px 0 rgba(255,255,255,.12);min-width:0
}
.pk .e{font-size:34px;line-height:1}
.pk .t{font-weight:900;font-size:14px;overflow-wrap:anywhere}
.pk[aria-pressed="true"]{box-shadow:0 0 0 3px var(--gold),inset -3px -3px 0 rgba(0,0,0,.3),inset 3px 3px 0 rgba(255,255,255,.2)}
.pk.got::after{content:"";position:absolute;right:5px;top:5px;width:12px;height:12px;background:var(--dia);box-shadow:0 0 0 2px #0b4a44}

.stage{
  background:var(--panel);box-shadow:0 0 0 3px var(--line),0 6px 0 3px #110e0b;padding:22px 14px 26px;
  display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center
}
.tile{font-size:80px;line-height:1;padding:12px 20px;background:#3b342d;box-shadow:0 0 0 3px #120f0c,inset -6px -6px 0 rgba(0,0,0,.25),inset 6px 6px 0 rgba(255,255,255,.1)}
.word{
  font-weight:900;font-size:clamp(40px,11vw,96px);line-height:1.1;display:flex;align-items:baseline;justify-content:center;max-width:100%;
  white-space:nowrap;padding:10px 6px
}
.word .r{color:var(--red-t)}
.word .g{color:var(--dia)}
.word .s{color:var(--muted)}
.lbl{display:flex;justify-content:space-between;gap:12px;width:100%;color:var(--muted);font-weight:800;font-size:15px}
.slider{width:100%;padding:6px 0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:56px;background:transparent;margin:0;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:22px;background:repeating-linear-gradient(90deg,var(--grass) 0 14px,#5ba337 14px 16px);box-shadow:0 0 0 3px #120f0c}
input[type=range]::-moz-range-track{height:22px;background:repeating-linear-gradient(90deg,var(--grass) 0 14px,#5ba337 14px 16px);box-shadow:0 0 0 3px #120f0c}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:54px;height:54px;margin-top:-16px;background:var(--stone);border:3px solid #120f0c;box-shadow:inset -5px -5px 0 rgba(0,0,0,.3),inset 5px 5px 0 rgba(255,255,255,.25);border-radius:0}
input[type=range]::-moz-range-thumb{width:48px;height:48px;background:var(--stone);border:3px solid #120f0c;border-radius:0}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.steps .btn{flex-direction:column;gap:0;min-height:68px;padding:6px;font-size:17px}
.steps small{font-size:13px;font-weight:700;opacity:.9}
.rate{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rate .btn{flex-direction:column;gap:2px;min-height:76px;font-size:20px}
.rate small{font-size:13px;font-weight:700;opacity:.9}
.msg{min-height:30px;text-align:center;font-weight:900;font-size:20px;color:var(--gold)}

.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:100%}
.ans{
  border:3px solid #120f0c;min-height:150px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;font-weight:900;font-size:clamp(20px,5vw,30px);
  box-shadow:inset -5px -5px 0 rgba(0,0,0,.3),inset 5px 5px 0 rgba(255,255,255,.2);min-width:0
}
.ans .e{font-size:56px;line-height:1}
.ans.hard{background:#57514a} .ans.soft{background:#2f6f9a}
.ans:disabled{opacity:.55}
.ans.pick{box-shadow:0 0 0 4px var(--gold),inset -5px -5px 0 rgba(0,0,0,.3),inset 5px 5px 0 rgba(255,255,255,.2);opacity:1}
.peek{width:100%;background:#15110e;padding:12px 14px;box-shadow:0 0 0 3px var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.peek b{font-family:var(--font-d);font-size:12px;color:var(--gold);line-height:1.6}
.res{font-weight:900;font-size:22px;text-wrap:balance}
.res.ok{color:var(--grass)} .res.no{color:var(--gold)}
.row2{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;width:100%}
.ore{image-rendering:pixelated;display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap" id="app"></div>

<script>
(function(){
var $=function(s){return document.querySelector(s)};
var esc=function(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var hl=function(t){return esc(t).replace(/R/g,'<span class="r">R</span>')};

/* on = consoante antes do encontro, gh = vogal fantasma, rest = sílaba com R, tail = resto da palavra */
var W=[
 {e:'🚂',on:'T',gh:'E',rest:'REM',tail:''},
 {e:'🛤️',on:'T',gh:'I',rest:'RI',tail:'LHO'},
 {e:'📷',on:'T',gh:'I',rest:'RI',tail:'PÉ'},
 {e:'🐉',on:'D',gh:'A',rest:'RA',tail:'GÃO'},
 {e:'💪',on:'B',gh:'A',rest:'RA',tail:'ÇO'},
 {e:'🍽️',on:'P',gh:'A',rest:'RA',tail:'TO'},
 {e:'🏖️',on:'P',gh:'A',rest:'RAI',tail:'A'},
 {e:'🌺',on:'C',gh:'A',rest:'RA',tail:'VO'},
 {e:'🌱',on:'G',gh:'A',rest:'RA',tail:'MA'},
 {e:'🕳️',on:'G',gh:'U',rest:'RU',tail:'TA'}
];
var S={mode:'elastico',wi:5,t:0,dia:0,got:{},sound:true,anim:0,msg:'',
  D:{round:0,rounds:5,word:5,target:'mole',peek:false,guess:null,score:0,got:false,over:false}};
function full(w){return w.on+w.rest+w.tail}
function ladder(w){return w.on+w.gh+'·'+w.rest+(w.tail?'·'+w.tail:'')}

var ac;
function beep(seq){if(!S.sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
 seq.forEach(function(n){var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+n[1];o.type='square';o.frequency.value=n[0];
 o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.04,t);g.gain.exponentialRampToValueAtTime(.0001,t+n[2]);o.start(t);o.stop(t+n[2]+.02)})}catch(e){}}
var SND={ok:[[660,0,.1],[880,.1,.16]],q:[[520,0,.14]],no:[[260,0,.16]],tick:[[400,0,.05]]};

function gem(size){
  var d=[[2,2],[4,2],[2,4],[9,3],[11,3],[11,5],[4,9],[6,9],[4,11],[10,10],[12,10],[10,12]];
  var s='<svg class="ore" width="'+size+'" height="'+size+'" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><rect width="16" height="16" fill="#7b756d"/><rect x="0" y="6" width="2" height="2" fill="#5f5a53"/><rect x="7" y="0" width="2" height="2" fill="#5f5a53"/><rect x="13" y="7" width="2" height="2" fill="#5f5a53"/>';
  d.forEach(function(p){s+='<rect x="'+p[0]+'" y="'+p[1]+'" width="2" height="2" fill="#4fe0d0"/>'});
  return s+'<rect width="16" height="1" fill="#9a948b"/><rect y="15" width="16" height="1" fill="#55504a"/></svg>'}

/* ---------- elástico ---------- */
function wordInner(w,t){
  var k=1-t,fs=(k*0.9).toFixed(3),op=Math.max(0,Math.min(1,k*1.2)).toFixed(2),hide=k<0.04?'display:none;':'';
  var ls=(k*0.12).toFixed(3);
  var h='<span style="letter-spacing:'+ls+'em">'+hl(w.on)+'</span>';
  h+='<span class="g" style="'+hide+'font-size:'+fs+'em;opacity:'+op+'">'+esc(w.gh)+'</span>';
  h+='<span class="s" style="'+hide+'font-size:'+fs+'em;opacity:'+op+'">·</span>';
  h+='<span style="letter-spacing:'+ls+'em">'+hl(w.rest)+'</span>';
  if(w.tail){h+='<span class="s" style="'+hide+'font-size:'+fs+'em;opacity:'+op+'">·</span><span style="letter-spacing:'+ls+'em">'+esc(w.tail)+'</span>'}
  return h}
function applyT(){
  var w=W[S.wi],el=$('#word');if(el)el.innerHTML=wordInner(w,S.t);
  var r=$('#rng');if(r&&+r.value!==Math.round(S.t*100))r.value=Math.round(S.t*100);
  var m=$('#mode');if(m)m.textContent=S.t<0.15?'Câmera lenta: cada pedacinho separado':S.t>0.9?'Tudo junto: palavra normal':'Juntando, a vogal vai sumindo'}
function glide(to,ms){
  cancelAnimationFrame(S.anim);var from=S.t,t0=null;
  function f(ts){if(t0===null)t0=ts;var p=Math.min(1,(ts-t0)/ms);S.t=from+(to-from)*(p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2);applyT();if(p<1)S.anim=requestAnimationFrame(f)}
  S.anim=requestAnimationFrame(f)}

function elasticoHTML(){
  var w=W[S.wi],h='<div class="panel" style="display:grid;gap:12px"><h2>Escolha a palavra</h2><div class="picker">';
  W.forEach(function(x,i){h+='<button class="pk'+(S.got[i]?' got':'')+'" data-act="pick" data-i="'+i+'" aria-pressed="'+(i===S.wi)+'" aria-label="'+esc(full(x))+'"><span class="e">'+x.e+'</span><span class="t">'+esc(full(x))+'</span></button>'});
  h+='</div></div><div class="stage"><div class="tile">'+w.e+'</div><div class="word" id="word" aria-label="'+esc(full(w))+'"></div><div class="hint" id="mode"></div>';
  h+='<div class="slider"><div class="lbl"><span>Câmera lenta</span><span>Palavra normal</span></div><input id="rng" type="range" min="0" max="100" step="1" value="'+Math.round(S.t*100)+'" aria-label="Elástico da vogal fantasma"></div>';
  h+='<div class="steps"><button class="btn soft" data-act="step" data-v="0">1<small>Devagar</small></button><button class="btn soft" data-act="step" data-v="0.6">2<small>Juntando</small></button><button class="btn soft" data-act="step" data-v="1">3<small>Junto</small></button></div>';
  h+='<button class="btn mid big" data-act="snap" style="width:100%">Soltar o elástico</button></div>';
  h+='<div class="msg" id="msg" aria-live="polite">'+esc(S.msg)+'</div>';
  h+='<div class="rate"><button class="btn go" data-act="rate" data-v="1">Suave<small>+1 diamante</small></button><button class="btn soft" data-act="rate" data-v="0">Quase<small>tentar de novo</small></button></div>';
  h+='<p class="hint">A criança fala a palavra esticada, junto com o elástico, e para na versão junta sem apertar a língua. A vogal pequena é só um apoio para o toque ficar leve.</p>';
  return h}

/* ---------- detetive ---------- */
function newRound(){var D=S.D;D.word=Math.floor(Math.random()*W.length);D.target=Math.random()<.5?'mole':'dura';D.peek=false;D.guess=null;D.got=false}
function detetiveHTML(){
  var D=S.D,w=W[D.word],h='';
  if(D.over){
    return '<div class="stage"><div class="tile">🕵️</div><h2>Caso encerrado!</h2><p class="res ok">'+D.score+' de '+D.rounds+' pistas certas</p><div class="row2"><button class="btn go big" data-act="dnew">Novo caso</button></div></div>'}
  h+='<div class="stage"><div class="kicker">Rodada '+(D.round+1)+' de '+D.rounds+'</div><div class="tile">'+w.e+'</div><div class="word" style="font-size:clamp(36px,10vw,72px)">'+hl(full(w))+'</div>';
  h+='<p class="hint">A terapeuta fala a palavra, ora com língua dura, ora com língua mole. A criança escuta e escolhe.</p>';
  h+='<div class="peek"><span>'+(D.peek?'<b>Hoje é: língua '+(D.target==='mole'?'MOLE':'DURA')+'</b>':'<span class="hint">Só a terapeuta olha a resposta.</span>')+'</span><button class="btn soft" style="min-height:48px;font-size:16px" data-act="peek">'+(D.peek?'Esconder':'Ver a resposta')+'</button></div>';
  h+='<div class="duo"><button class="ans hard'+(D.guess==='dura'?' pick':'')+'" data-act="guess" data-v="dura"'+(D.guess?' disabled':'')+'><span class="e">🪨</span>Língua dura</button><button class="ans soft'+(D.guess==='mole'?' pick':'')+'" data-act="guess" data-v="mole"'+(D.guess?' disabled':'')+'><span class="e">☁️</span>Língua mole</button></div>';
  if(D.guess){
    var ok=D.guess===D.target;
    h+='<p class="res '+(ok?'ok':'no')+'">'+(ok?'Boa, detetive! Você achou a pista.':'Quase! Era língua '+D.target+'.')+'</p>';
    h+='<p class="hint">Agora a criança fala a palavra com língua mole.</p><div class="row2"><button class="btn go" data-act="dmole"'+(D.got?' disabled':'')+'>Falou suave (+1)</button><button class="btn mid" data-act="dnext">'+(D.round+1>=D.rounds?'Ver resultado':'Próxima rodada')+'</button></div>'}
  return h+'</div>'}

function render(){
  var h='<header class="top"><div><div class="kicker">Terapia do R brando</div><h1>Forja do Elástico</h1></div><div class="dia" aria-label="'+S.dia+' diamantes">'+gem(30)+'<span>'+S.dia+'</span></div></header>';
  h+='<div class="tabs" role="tablist"><button class="tab" role="tab" data-act="mode" data-m="elastico" aria-selected="'+(S.mode==='elastico')+'">Elástico da vogal</button><button class="tab" role="tab" data-act="mode" data-m="detetive" aria-selected="'+(S.mode==='detetive')+'">Detetive de língua</button></div>';
  h+=S.mode==='elastico'?elasticoHTML():detetiveHTML();
  h+='<div class="row2"><button class="btn soft" data-act="snd" style="min-height:52px;font-size:16px">Som: '+(S.sound?'ligado':'desligado')+'</button></div>';
  $('#app').innerHTML=h;
  if(S.mode==='elastico')applyT()}

function act(a,d){
  if(a==='mode'){S.mode=d.m;S.msg='';cancelAnimationFrame(S.anim);render()}
  else if(a==='pick'){S.wi=+d.i;S.t=0;S.msg='';cancelAnimationFrame(S.anim);render()}
  else if(a==='step'){glide(+d.v,700);beep(SND.tick)}
  else if(a==='snap'){S.t=0;applyT();setTimeout(function(){glide(1,2800)},250);beep(SND.tick)}
  else if(a==='rate'){
    if(+d.v){S.dia++;S.got[S.wi]=true;S.msg='Isso! Diamante na mochila!';beep(SND.ok)}
    else{S.msg='Vamos de novo, devagar.';beep(SND.q)}
    render()}
  else if(a==='snd'){S.sound=!S.sound;render()}
  else if(a==='peek'){S.D.peek=!S.D.peek;render()}
  else if(a==='guess'){S.D.guess=d.v;if(d.v===S.D.target){S.D.score++;S.dia++;beep(SND.ok)}else beep(SND.no);render()}
  else if(a==='dmole'){if(!S.D.got){S.D.got=true;S.dia++;beep(SND.ok);render()}}
  else if(a==='dnext'){S.D.round++;if(S.D.round>=S.D.rounds){S.D.over=true}else newRound();render()}
  else if(a==='dnew'){S.D.round=0;S.D.score=0;S.D.over=false;newRound();render()}}
document.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(b&&!b.disabled)act(b.getAttribute('data-act'),b.dataset)});
document.addEventListener('input',function(e){if(e.target.id==='rng'){cancelAnimationFrame(S.anim);S.t=+e.target.value/100;applyT()}});
newRound();render();
})();
</script>

</body></html>
